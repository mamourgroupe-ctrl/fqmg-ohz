# Manual live voice check (Phase 2). Calls the real Azure Speech API once per step with the
# credentials stored in GitHub Secrets, then uploads the audio and JSON summary as an artifact.
#
# PLACEMENT: GitHub runs only the copy stored in the repository-root .github/workflows/ directory,
# which is where this file lives once it is on the default branch. GitHub lists the workflow, and
# offers the Run workflow button, only once the file exists on the default branch (main).
#
# CODE SOURCE: the project lives at the repository root (the former fqmg-ohz-next/ sub-project was
# merged into the root). The `code_ref` input selects which branch to check out; it defaults to
# main. Pass the working branch name when you want to run this before the merge lands on main.
#
# TRIGGER: workflow_dispatch only (manual). It is not triggered by pushes or pull requests.
# Running it makes real, billable provider requests.
#
# SECRETS (names only; create them in GitHub > Settings > Secrets and variables > Actions):
#   AZURE_SPEECH_KEY (required), and AZURE_SPEECH_REGION or AZURE_SPEECH_ENDPOINT.
# Secrets are passed only to the two steps that need them, never at workflow or job level.
# The leak scan blocks the upload if a key value or token-shaped string reaches an output file.

name: Voice live check (manual)

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: Branch or tag to check out and run the live check against.
        type: string
        default: main
      provider:
        description: Voice provider to check. Only azure is supported by this check.
        type: choice
        options:
          - azure
        default: azure

permissions:
  contents: read

concurrency:
  group: voice-live-check
  cancel-in-progress: false

jobs:
  voice-live-check:
    name: Live check (${{ inputs.provider }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run live voice check (makes provider API calls)
        id: live-check
        continue-on-error: true
        env:
          VOICE_PROVIDER: ${{ inputs.provider }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_ENDPOINT: ${{ secrets.AZURE_SPEECH_ENDPOINT }}
        run: npm run voice:live-check

      - name: Leak scan before upload
        id: leak-scan
        if: ${{ always() }}
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          # Prints a description and a file count only. Never prints a matched value.
          OUTPUT_DIR="voice-live-output"
          leaks=0
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "No output folder was created, so there is nothing to scan."
            exit 0
          fi

          check_pattern() {
            local description="$1"
            shift
            local rc=0
            grep -rl "$@" -- "$OUTPUT_DIR" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "LEAK: $description found in an output file. Upload blocked."
              leaks=1
            elif [ "$rc" -gt 1 ]; then
              echo "Scan error while checking $description (grep exit $rc). Upload blocked."
              leaks=1
            fi
          }

          if [ -n "${AZURE_SPEECH_KEY:-}" ]; then
            check_pattern "the AZURE_SPEECH_KEY value" -F -e "$AZURE_SPEECH_KEY"
          fi
          check_pattern "a token-shaped string in a JSON output" -E --include='*.json' -e 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'

          if [ "$leaks" -ne 0 ]; then
            exit 1
          fi
          echo "Leak scan passed: $(find "$OUTPUT_DIR" -type f | wc -l) file(s) checked."

      - name: Upload audio and JSON summary (only after a passing leak scan)
        if: ${{ always() && steps.leak-scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: voice-live-check-${{ inputs.provider }}-${{ github.run_id }}
          path: voice-live-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail the job if the live check or leak scan did not pass
        if: ${{ always() }}
        env:
          CHECK_OUTCOME: ${{ steps.live-check.outcome }}
          SCAN_OUTCOME: ${{ steps.leak-scan.outcome }}
        run: |
          if [ "$CHECK_OUTCOME" != "success" ] || [ "$SCAN_OUTCOME" != "success" ]; then
            echo "Voice live check did not pass (check: $CHECK_OUTCOME, leak scan: $SCAN_OUTCOME)."
            if [ "$SCAN_OUTCOME" = "success" ]; then
              echo "The artifact was uploaded; open summary.json for the failed step and its detail."
            else
              echo "The leak scan blocked the upload, so no artifact was uploaded. Do not share the run logs until the key is rotated if a value leaked."
            fi
            exit 1
          fi
          echo "Pipeline passed. Listen to the audio before relying on it; accent and pronunciation were not judged."
